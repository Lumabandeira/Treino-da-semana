<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Treino - Glúteos</title>
    <meta name="description" content="Seu plano de treino semanal focado em glúteos e ganho de massa muscular.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-dumbbell"></i>
                <span>Vida Luma</span>
            </div>
            <h1>Plano de Treino - Glúteos</h1>
            <p>Hipertrofia - 5 Dias por Semana</p>
        </header>

        <nav class="tabs-container">
            <button class="tab-btn active" data-day="segunda">
                <span class="day-short">SEG</span>
                <span class="day-long">Segunda</span>
            </button>
            <button class="tab-btn" data-day="terca">
                <span class="day-short">TER</span>
                <span class="day-long">Terça</span>
            </button>
            <button class="tab-btn" data-day="quarta">
                <span class="day-short">QUA</span>
                <span class="day-long">Quarta</span>
            </button>
            <button class="tab-btn" data-day="quinta">
                <span class="day-short">QUI</span>
                <span class="day-long">Quinta</span>
            </button>
            <button class="tab-btn" data-day="sexta">
                <span class="day-short">SEX</span>
                <span class="day-long">Sexta</span>
            </button>
        </nav>

        <main id="workout-content">
            <!-- Content will be injected by JavaScript -->
        </main>

        <footer>
            <div class="footer-info">
                <h3>Orientações Rápidas</h3>
                <div class="tips-grid">
                    <div class="tip-card">
                        <i class="fa-solid fa-chart-line"></i>
                        <h4>Progressão</h4>
                        <p>Aumente 2,5-5kg quando estiver fácil.</p>
                    </div>
                    <div class="tip-card">
                        <i class="fa-solid fa-bed"></i>
                        <h4>Descanso</h4>
                        <p>Durma 7-9h e descanse 48h o mesmo grupo.</p>
                    </div>
                    <div class="tip-card">
                        <i class="fa-solid fa-glass-water"></i>
                        <h4>Hidratação</h4>
                        <p>35-40ml por kg de peso corporal.</p>
                    </div>
                </div>
            </div>
            <p class="copyright">© 2026 Vida Luma - Plano elaborado por profissional.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
